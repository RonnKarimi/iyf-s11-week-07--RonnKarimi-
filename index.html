<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 - Local Storage & State Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f4f4;
        }

        h1, h2 {
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: white;
            margin: 10px 0;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filters {
            margin: 15px 0;
        }

        hr {
            margin: 40px 0;
        }
    </style>
</head>

<body>

    <h1>Persistent To-Do List</h1>

    <input
        type="text"
        id="todo-input"
        placeholder="Enter a new task">

    <button id="add-btn">Add Todo</button>

    <div class="filters">
        <button onclick="setFilter('all')">All</button>
        <button onclick="setFilter('active')">Active</button>
        <button onclick="setFilter('completed')">Completed</button>
    </div>

    <ul id="todo-list"></ul>

    <hr>

    <h2>Contact Form (Session Storage)</h2>

    <form id="contact-form">

        <input
            type="text"
            name="name"
            placeholder="Your Name"
            required>

        <input
            type="email"
            name="email"
            placeholder="Your Email"
            required>

        <textarea
            name="message"
            rows="5"
            placeholder="Write your message..."
            required></textarea>

        <button type="submit">
            Submit
        </button>

    </form>

    <script src="app.js"></script>

</body>
</html>
