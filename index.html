<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 - Local Storage & State Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Persistent To-Do List</h1>

        <div class="todo-input">

            <input
                type="text"
                id="todo-input"
                placeholder="Enter a new task">

            <button id="add-btn">
                Add Todo
            </button>

        </div>

        <div class="filters">

            <button onclick="setFilter('all')">
                All
            </button>

            <button onclick="setFilter('active')">
                Active
            </button>

            <button onclick="setFilter('completed')">
                Completed
            </button>

        </div>

        <ul id="todo-list"></ul>

        <hr>

        <h2>Contact Form (Session Storage)</h2>

        <form id="contact-form">

            <input
                type="text"
                name="name"
                placeholder="Your Name"
                required>

            <input
                type="email"
                name="email"
                placeholder="Your Email"
                required>

            <textarea
                name="message"
                rows="5"
                placeholder="Write your message..."
                required></textarea>

            <button type="submit">
                Submit
            </button>

        </form>

    </div>

    <script src="app.js"></script>

</body>
</html>
